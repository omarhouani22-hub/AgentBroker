<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clara video experiment</title>
<style>body{background:#101827;color:#edf2ff;font:16px system-ui;max-width:600px;margin:2rem auto;padding:1rem}label{display:block;margin:1rem 0}button{padding:.8rem;border-radius:.6rem}canvas{max-width:100%;border-radius:1rem}p{line-height:1.5}</style>
<h1>Clara video experiment</h1><p>Create a simple animated portrait from an image and an audio file on your device. This is not realistic lip-sync. No file is uploaded by this page.</p>
<label>Portrait <input id="portrait" type="file" accept="image/*"></label><label>Voice recording <input id="voice" type="file" accept="audio/*"></label><button id="make" type="button">Record video</button><p id="status" role="status"></p><canvas id="canvas" width="480" height="480"></canvas><p><a id="download" hidden>Download video</a></p>
<script>
const $=id=>document.getElementById(id);let outputUrl;
$('make').onclick=async()=>{let context,stream,recorder,photoUrl,voiceUrl,raf;const button=$('make'),status=$('status'),canvas=$('canvas');
try{const portrait=$('portrait').files[0],voice=$('voice').files[0];if(!portrait||!voice)throw Error('Choose a portrait and an audio file.');if(portrait.size>10e6||voice.size>20e6)throw Error('Image must be under 10 MB and audio under 20 MB.');if(!canvas.captureStream||!window.MediaRecorder||!window.AudioContext)throw Error('Video recording is not supported by this browser.');button.disabled=true;$('download').hidden=true;status.textContent='Preparing…';
photoUrl=URL.createObjectURL(portrait);voiceUrl=URL.createObjectURL(voice);const photo=new Image();photo.src=photoUrl;await photo.decode();const audio=new Audio(voiceUrl);await new Promise((resolve,reject)=>{audio.onloadedmetadata=resolve;audio.onerror=()=>reject(Error('Audio could not be read.'));});if(!Number.isFinite(audio.duration)||audio.duration>60)throw Error('Choose audio up to 60 seconds.');
context=new AudioContext();const source=context.createMediaElementSource(audio),destination=context.createMediaStreamDestination(),analyser=context.createAnalyser();source.connect(analyser);analyser.connect(destination);analyser.connect(context.destination);stream=canvas.captureStream(24);destination.stream.getAudioTracks().forEach(t=>stream.addTrack(t));let mime=['video/webm;codecs=vp8,opus','video/mp4','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime)throw Error('This browser has no supported video recorder format.');recorder=new MediaRecorder(stream,{mimeType:mime});const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const stopped=new Promise((resolve,reject)=>{recorder.onstop=resolve;recorder.onerror=()=>reject(Error('Recording failed.'));});
const ctx=canvas.getContext('2d'),levels=new Uint8Array(analyser.frequencyBinCount);function frame(){ctx.fillStyle='#131d30';ctx.fillRect(0,0,480,480);const scale=Math.max(480/photo.width,480/photo.height),w=photo.width*scale,h=photo.height*scale;ctx.drawImage(photo,(480-w)/2,(480-h)/2,w,h);analyser.getByteTimeDomainData(levels);const volume=levels.reduce((sum,x)=>sum+Math.abs(x-128),0)/levels.length;ctx.fillStyle=volume>2?'#9de0c1':'#b9c7e1';ctx.beginPath();ctx.arc(450,450,Math.min(13,5+volume),0,Math.PI*2);ctx.fill();raf=requestAnimationFrame(frame)}
await context.resume();recorder.start();frame();status.textContent='Recording in real time…';await audio.play();await new Promise((resolve,reject)=>{audio.onended=resolve;audio.onerror=()=>reject(Error('Audio playback failed.'));});recorder.stop();await stopped;if(!chunks.length)throw Error('No video data was recorded.');if(outputUrl)URL.revokeObjectURL(outputUrl);outputUrl=URL.createObjectURL(new Blob(chunks,{type:mime}));$('download').href=outputUrl;$('download').download='clara-video.'+(mime.startsWith('video/mp4')?'mp4':'webm');$('download').hidden=false;status.textContent='Video ready. Preview and check it before sharing.';
}catch(error){status.textContent=error.message||'Video could not be created.';}finally{if(recorder&&recorder.state!=='inactive')recorder.stop();if(raf)cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());if(context)await context.close();if(photoUrl)URL.revokeObjectURL(photoUrl);if(voiceUrl)URL.revokeObjectURL(voiceUrl);button.disabled=false;}};
</script></html>
