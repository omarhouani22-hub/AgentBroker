services:
  - type: web
    name: agentbroker
    runtime: python
    plan: free
    buildCommand: bash build_agentbroker.sh
    startCommand: gunicorn --bind 0.0.0.0:${PORT:-10000} --workers 1 --threads 2 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
