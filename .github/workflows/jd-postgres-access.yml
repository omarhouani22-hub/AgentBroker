name: JD Postgres access boundaries
on:
  pull_request:
    paths:
      - 'db/reference/jd_orders_private_postgres.sql'
      - 'tests/test_jd_postgres_access_boundaries.py'
      - '.github/workflows/jd-postgres-access.yml'
  workflow_dispatch:
jobs:
  boundaries:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: agentbroker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_runner -d agentbroker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_JD_POSTGRES_DSN: postgresql://test_runner:disposable_test_only@localhost:5432/agentbroker_test
      PGPASSWORD: disposable_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - run: psql -h localhost -U test_runner -d agentbroker_test -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;"
      - run: psql -h localhost -U test_runner -d agentbroker_test -v ON_ERROR_STOP=1 -f db/reference/jd_orders_private_postgres.sql
      - run: python -m unittest discover -s tests -p test_jd_postgres_access_boundaries.py -v
