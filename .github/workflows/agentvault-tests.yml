name: AgentVault isolated tests
on:
  push:
    branches:
      - feat/agentvault-prototype-20261024
    paths:
      - 'agentvault*.py'
      - 'test_agentvault*.py'
      - 'agentvault_requirements.txt'
      - '.github/workflows/agentvault-tests.yml'
  pull_request:
    paths:
      - 'agentvault*.py'
      - 'test_agentvault*.py'
      - 'agentvault_requirements.txt'
      - '.github/workflows/agentvault-tests.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: python -m pip install -r agentvault_requirements.txt
      - name: Run AgentVault tests
        run: python -m unittest -v test_agentvault.py test_agentvault_api.py test_agentvault_paypal.py
