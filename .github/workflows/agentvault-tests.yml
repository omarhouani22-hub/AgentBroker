name: AgentVault isolated tests
on:
  push:
    branches:
      - feat/agentvault-prototype-20261024
      - feat/agentvault-service-launch-20261024
    paths:
      - 'agentvault*.py'
      - 'test_agentvault*.py'
      - 'agentvault_requirements.txt'
      - '.github/workflows/agentvault-tests.yml'
  pull_request:
    paths:
      - 'agentvault*.py'
      - 'test_agentvault*.py'
      - 'agentvault_requirements.txt'
      - '.github/workflows/agentvault-tests.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: python -m pip install -r agentvault_requirements.txt
      - name: Run AgentVault tests
        run: python -m unittest -v test_agentvault.py test_agentvault_api.py test_agentvault_paypal.py test_agentvault_market_intel.py test_agentvault_service.py test_agentvault_ops.py test_agentvault_backup.py test_agentvault_reconcile.py
  postgres-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agentvault_ci
          POSTGRES_USER: agentvault_ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentvault_ci -d agentvault_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENTVAULT_TEST_POSTGRES_URL: postgresql://agentvault_ci:disposable-ci-only@127.0.0.1:5432/agentvault_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: python -m pip install -r agentvault_requirements.txt
      - name: Exercise actual PostgreSQL concurrency and logical recovery
        run: python -m unittest -v test_agentvault_postgres.py
