name: Hermes checkpoint tests

on:
  pull_request:
    paths:
      - 'hermes_pilot.py'
      - 'hermes_team.py'
      - 'test_hermes_team.py'
      - '.github/workflows/agent-learning.yml'
      - 'test_hermes.py'
      - '.github/workflows/hermes-checkpoint-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt requests
      - name: Run no-provider checkpoint tests
        env:
          HERMES_PYTHON: /nonexistent/hermes
        run: |
          python -m unittest -v \
            test_hermes.HermesTests.test_encrypted_backup_preserves_skill_and_rejects_stale_restore \
            test_hermes.HermesTests.test_invalid_encrypted_checkpoint_cannot_replace_existing_skill \
            test_hermes.HermesTests.test_encrypted_export_survives_new_database \
            test_hermes.HermesTests.test_tampered_checkpoint_rejected \
            test_hermes_team.TeamTests.test_backup_only_never_starts_paid_learning
