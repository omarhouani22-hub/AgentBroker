name: JD queue dashboard
on:
  pull_request:
    paths:
      - 'app.py'
      - 'tests/test_jd_queue_dashboard.py'
      - '.github/workflows/jd-queue-dashboard.yml'
  workflow_dispatch:
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_jd_queue_dashboard.py -v
      - run: python -m py_compile app.py
