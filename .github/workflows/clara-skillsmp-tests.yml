name: Clara SkillsMP isolated tests
on:
  pull_request:
    paths:
      - 'clara_skillsmp.py'
      - 'test_clara_skillsmp.py'
      - '.github/workflows/clara-skillsmp-tests.yml'
  workflow_dispatch:
jobs:
  offline-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flask for isolated tests
        run: python -m pip install 'Flask>=3,<4'
      - name: Run offline SkillsMP tests
        run: python -m unittest -v test_clara_skillsmp
