name: JD Postgres executor tests
on:
  pull_request:
    paths:
      - 'jd_order_postgres_executor.py'
      - 'tests/test_jd_postgres_executor.py'
      - '.github/workflows/jd-postgres-executor.yml'
  workflow_dispatch:
jobs:
  executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_jd_postgres_executor.py -v
      - run: python -m py_compile jd_order_postgres_executor.py
