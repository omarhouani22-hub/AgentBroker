name: Companion language checks
on:
  pull_request:
    paths:
      - 'app.py'
      - 'moltbook.py'
      - 'tests/test_companion_languages.py'
      - '.github/workflows/companion-languages.yml'
  workflow_dispatch:
jobs:
  multilingual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_companion_languages.py -v
      - run: python -m py_compile app.py moltbook.py
