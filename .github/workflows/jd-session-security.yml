name: JD browser session security
on:
  pull_request:
    paths:
      - 'app.py'
      - 'tests/test_jd_session_security.py'
      - '.github/workflows/jd-session-security.yml'
  workflow_dispatch:
jobs:
  session-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_jd_session_security.py -v
