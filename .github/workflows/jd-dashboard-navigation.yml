name: JD dashboard navigation
on:
  pull_request:
    paths:
      - 'app.py'
      - 'tests/test_jd_dashboard_navigation.py'
      - '.github/workflows/jd-dashboard-navigation.yml'
  workflow_dispatch:
jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_jd_dashboard_navigation.py -v
      - run: python -m py_compile app.py
