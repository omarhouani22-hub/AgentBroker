name: JD storage contract
on:
  pull_request:
    paths:
      - 'jd_order_storage_contract.py'
      - 'tests/test_jd_order_storage_contract.py'
      - '.github/workflows/jd-storage-contract.yml'
  workflow_dispatch:
jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_jd_order_storage_contract.py -v
      - run: python -m py_compile jd_order_storage_contract.py
