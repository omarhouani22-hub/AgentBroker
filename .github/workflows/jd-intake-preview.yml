name: JD intake preview tests
on:
  pull_request:
    paths:
      - 'app.py'
      - 'tests/test_jd_intake_preview.py'
      - '.github/workflows/jd-intake-preview.yml'
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_jd_intake_preview.py -v
      - run: python -m py_compile app.py
