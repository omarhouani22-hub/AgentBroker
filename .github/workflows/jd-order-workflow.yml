name: JD order state tests
on:
  pull_request:
    paths:
      - 'jd_order_workflow.py'
      - 'tests/test_jd_order_workflow.py'
      - '.github/workflows/jd-order-workflow.yml'
  workflow_dispatch:
jobs:
  transitions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_jd_order_workflow.py -v
      - run: python -m py_compile jd_order_workflow.py
