name: Internal speech service
on:
  pull_request:
    paths: ['local_speech.py', 'build_local_speech.py', 'requirements-speech.txt', 'clara_speech.py', 'tests/*speech*', '.github/workflows/internal-speech.yml']
  push:
    branches: [main]
    paths: ['local_speech.py', 'build_local_speech.py', 'requirements-speech.txt', 'clara_speech.py', '.github/workflows/internal-speech.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  english-female-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r requirements-speech.txt
      - run: python build_local_speech.py
      - run: python -m unittest tests.test_local_speech tests.test_english_interface -v
      - name: Real inference within a 512 MiB no-swap cgroup
        run: sudo systemd-run --wait --pipe --collect --unit=clara-piper-test --property=MemoryMax=512M --property=MemorySwapMax=0 --property=RuntimeMaxSec=60 --working-directory="$GITHUB_WORKSPACE" "$(which python)" tests/internal_speech_smoke.py
