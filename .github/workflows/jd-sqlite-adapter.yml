name: JD SQLite transaction adapter
on:
  pull_request:
    paths:
      - 'jd_order_sqlite_adapter.py'
      - 'tests/test_jd_order_sqlite_adapter.py'
      - '.github/workflows/jd-sqlite-adapter.yml'
  workflow_dispatch:
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_jd_order_sqlite_adapter.py -v
      - run: python -m py_compile jd_order_sqlite_adapter.py
