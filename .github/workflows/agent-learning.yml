name: AgentBroker internal team heartbeat
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  id-token: write
  actions: read
concurrency:
  group: agentbroker-daily-learning
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Restore encrypted checkpoint and advance AgentBroker
        env:
          GH_TOKEN: ${{ github.token }}
          BROKER_URL: https://agentbroker-jayk.onrender.com
        shell: bash
        run: |
          python3 - <<'PY'
          import io, json, os, time, zipfile
          from pathlib import Path
          from urllib.request import Request, urlopen, build_opener, HTTPRedirectHandler
          from urllib.parse import quote, urlparse
          from urllib.error import HTTPError, URLError
          broker = os.environ['BROKER_URL']
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          api = build_opener(NoRedirect)
          headers = {'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}
          base = 'https://api.github.com/repos/omarhouani22-hub/AgentBroker/actions/artifacts'
          with api.open(Request(base+'?per_page=100', headers=headers), timeout=30) as response:
              artifacts = json.load(response)['artifacts']
          checkpoints = sorted((a for a in artifacts if a['name'].startswith('agent-learning-checkpoint-') and not a['expired']), key=lambda a:a['created_at'], reverse=True)
          saved = {}
          if checkpoints:
              artifact = checkpoints[0]
              try:
                  api.open(Request(base+'/'+str(artifact['id'])+'/zip',headers=headers),timeout=30)
                  raise SystemExit('Expected a signed artifact download location')
              except HTTPError as error:
                  if error.code != 302: raise SystemExit('Cannot retrieve the saved checkpoint')
                  location=error.headers['Location']
              if urlparse(location).scheme!='https':raise SystemExit('Invalid artifact location')
              # Do not forward the GitHub credential to artifact storage.
              with urlopen(location,timeout=60) as response: archive=response.read(2000001)
              if len(archive)>2000000:raise SystemExit('Checkpoint archive too large')
              with zipfile.ZipFile(io.BytesIO(archive)) as archive:
                  for filename in ('checkpoint.txt','team-checkpoint.txt'):
                      if filename not in archive.namelist(): continue
                      entry=archive.getinfo(filename)
                      if entry.file_size>1500000:raise SystemExit('Checkpoint too large')
                      saved[filename]=archive.read(entry).decode()
                      Path(filename).write_text(saved[filename])
          for attempt in range(3):
              try:
                  with urlopen(broker+'/health',timeout=90) as response: health=json.load(response)
                  if 'autonomous_clock_v1' not in health.get('capabilities',[]):raise SystemExit('Direct learning clock is not deployed')
                  break
              except (HTTPError,URLError,TimeoutError):
                  if attempt==2:raise SystemExit('AgentBroker did not wake; no learning step sent')
                  time.sleep(10)
          failed=False
          for endpoint, filename, limit in (('/autonomy/clock','checkpoint.txt',4),('/hermes/team/clock','team-checkpoint.txt',6)):
              checkpoint=saved.get(filename)
              for _ in range(limit):
                  # The heartbeat supplies only identity and encrypted state. AgentBroker decides what to do.
                  audience=broker+'/autonomy/clock'
                  identity_url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience='+quote(audience,safe='')
                  identity_request=Request(identity_url,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
                  with urlopen(identity_request,timeout=30) as response: token=json.load(response)['value']
                  request=Request(broker+endpoint,data=json.dumps({'checkpoint':checkpoint}).encode(),headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
                  try:
                      with api.open(request,timeout=150) as response: result=json.load(response)
                  except (HTTPError,URLError,TimeoutError) as error:
                      print('Engine stopped safely:',endpoint,getattr(error,'code','connection interrupted'))
                      failed=True
                      break
                  checkpoint=result.get('checkpoint')
                  if not isinstance(checkpoint,str):raise SystemExit('No encrypted checkpoint returned')
                  Path(filename).write_text(checkpoint)
                  print(json.dumps({'engine':endpoint,**{k:result[k] for k in ('status','stage') if k in result}}))
                  if result.get('status')=='completed':break
                  if result.get('status')!='ready':
                      failed=True
                      break
          if failed:raise SystemExit('An engine stopped; no automatic charged retry')
          PY
      - name: Preserve encrypted learning state
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent-learning-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            checkpoint.txt
            team-checkpoint.txt
          retention-days: 90
          if-no-files-found: warn
