name: JD operator browser session
on:
  pull_request:
    paths:
      - 'app.py'
      - 'tests/test_jd_browser_session_queue.py'
      - '.github/workflows/jd-browser-session-queue.yml'
  workflow_dispatch:
jobs:
  browser-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_jd_browser_session_queue.py -v
      - run: python -m py_compile tests/test_jd_browser_session_queue.py
